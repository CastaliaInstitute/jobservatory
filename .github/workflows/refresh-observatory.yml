name: Refresh labor observatory

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:collect
      - run: npm test
      - name: Commit new observations
        run: |
          if git diff --quiet -- public/api data/history.ndjson; then exit 0; fi
          git config user.name "castalia-observatory[bot]"
          git config user.email "castalia-observatory[bot]@users.noreply.github.com"
          git add public/api data/history.ndjson
          git commit -m "data: refresh AI labor observations"
          git push
