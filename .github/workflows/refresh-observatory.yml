name: Refresh Jobservatory corpus

on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "public/api/**"
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:collect
      - run: npm run data:validate
      - run: npm run ml:evaluate
      - run: npm run lint
      - run: npm test
      - name: Commit new observations
        run: |
          if git diff --quiet -- public/api data; then exit 0; fi
          git config user.name "jobservatory[bot]"
          git config user.email "jobservatory[bot]@users.noreply.github.com"
          git add public/api data/history.ndjson data/observation_versions.ndjson data/snapshots
          git commit -m "data: refresh AI labor observations"
          git push
